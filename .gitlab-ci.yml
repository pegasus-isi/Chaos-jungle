stages:
  - test
  - build
  - verify

default:
  tags:
    - docker

unit_tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12"]
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - python -m pytest tests/ -q --strict-markers

.local_llm_experiment:
  stage: verify
  image: python:3.12-slim
  timeout: 5m
  needs:
    - job: build_dist
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - python -m pip install dist/*.whl
    - cd /tmp
    - python "$CI_PROJECT_DIR/ci/run_real_experiment.py" --fault "$CJ_EVAL_FAULT" --output-dir "$CI_PROJECT_DIR/ci-artifacts/real-experiment/$CJ_EVAL_FAULT"
  artifacts:
    when: always
    paths:
      - ci-artifacts/real-experiment/
    expire_in: 1 week

llm_local_latency:
  extends: .local_llm_experiment
  variables:
    CJ_EVAL_FAULT: latency

llm_local_unavailable:
  extends: .local_llm_experiment
  variables:
    CJ_EVAL_FAULT: unavailable

llm_local_rate_limit:
  extends: .local_llm_experiment
  variables:
    CJ_EVAL_FAULT: rate-limit

.live_llm_experiment:
  stage: verify
  image: python:3.12-slim
  timeout: 10m
  needs:
    - job: build_dist
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - when: never
  script:
    # GitLab injects project/group CI variables; do not copy their values into YAML.
    - ': "${CJ_EVAL_BASE_URL:?Set CJ_EVAL_BASE_URL in GitLab CI/CD Variables}"'
    - ': "${CJ_EVAL_MODEL:?Set CJ_EVAL_MODEL in GitLab CI/CD Variables}"'
    - ': "${CJ_EVAL_API_KEY:?Set CJ_EVAL_API_KEY in GitLab CI/CD Variables}"'
    - python -m pip install dist/*.whl
    - cd /tmp
    - python "$CI_PROJECT_DIR/ci/run_real_experiment.py" --mode live --fault "$CJ_EVAL_FAULT" --output-dir "$CI_PROJECT_DIR/ci-artifacts/real-llm-experiment/$CJ_EVAL_FAULT"
  artifacts:
    when: always
    paths:
      - ci-artifacts/real-llm-experiment/
    expire_in: 1 week

llm_live_latency:
  extends: .live_llm_experiment
  variables:
    CJ_EVAL_FAULT: latency

llm_live_unavailable:
  extends: .live_llm_experiment
  variables:
    CJ_EVAL_FAULT: unavailable

llm_live_rate_limit:
  extends: .live_llm_experiment
  variables:
    CJ_EVAL_FAULT: rate-limit

.agent_use_case:
  stage: verify
  image: python:3.12-slim
  timeout: 5m
  needs:
    - job: build_dist
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - python -m pip install dist/*.whl
    - cd /tmp
    - python "$CI_PROJECT_DIR/ci/run_agent_use_case.py" --case "$CJ_USE_CASE" --output-dir "$CI_PROJECT_DIR/ci-artifacts/agent-use-case/$CJ_USE_CASE"
  artifacts:
    when: always
    paths:
      - ci-artifacts/agent-use-case/
    expire_in: 1 week

agent_tool_result:
  extends: .agent_use_case
  variables:
    CJ_USE_CASE: tool-result

agent_tool_result_requests:
  extends: .agent_use_case
  variables:
    CJ_USE_CASE: tool-result-requests

agent_prompt_input:
  extends: .agent_use_case
  variables:
    CJ_USE_CASE: prompt-input

.resource_experiment:
  stage: verify
  image: python:3.12-slim
  timeout: 10m
  needs:
    - job: build_dist
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: manual
      allow_failure: true
  script:
    - apt-get update
    - python -m pip install dist/*.whl
    - cd /tmp
    - python "$CI_PROJECT_DIR/ci/run_resource_experiment.py" --fault "$CJ_RESOURCE_FAULT" --output-dir "$CI_PROJECT_DIR/ci-artifacts/resource-experiment/$CJ_RESOURCE_FAULT"
  artifacts:
    when: always
    paths:
      - ci-artifacts/resource-experiment/
    expire_in: 1 week

resource_cpu_experiment:
  extends: .resource_experiment
  variables:
    CJ_RESOURCE_FAULT: cpu

resource_memory_experiment:
  extends: .resource_experiment
  variables:
    CJ_RESOURCE_FAULT: memory

lint:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install "ruff==0.17.4"
    - python ci/check_ruff_baseline.py
    - python -m ruff check ci/run_real_experiment.py
    - python -m ruff check ci/run_resource_experiment.py ci/resource_workload.py
    - python -m ruff check ci/run_agent_use_case.py
    - python -m ruff check ci/generate_skill_strategy.py

docs_build:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install ".[docs]"
    - python -m sphinx -q -b html docs docs/_build/html
  artifacts:
    paths:
      - docs/_build/html/
    expire_in: 1 week

build_dist:
  stage: build
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python -m twine check dist/*
    - |
      python - <<'PY'
      from pathlib import Path
      from tarfile import open as open_tar
      from zipfile import ZipFile

      wheel, = Path("dist").glob("*.whl")
      sdist, = Path("dist").glob("*.tar.gz")
      resource = "chaos_jungle/scripts/bpf/flow_modify.c"
      with ZipFile(wheel) as archive:
          assert resource in archive.namelist(), f"Missing wheel resource: {resource}"
      with open_tar(sdist) as archive:
          names = archive.getnames()
          assert any(name.endswith("/" + resource) for name in names)
          assert not any("/evaluation/" in name or "/results/" in name for name in names)
      PY
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

verify_dist:
  stage: verify
  image: python:3.12-slim
  needs:
    - job: build_dist
      artifacts: true
  script:
    - python -m pip install dist/*.whl
    - cd /tmp
    - python -c 'from importlib.metadata import version; from importlib.resources import files; import chaos_jungle; assert version("chaos-jungle") == chaos_jungle.__version__; assert (files("chaos_jungle.scripts.bpf") / "flow_modify.c").is_file()'
    - chaos-jungle --help

dependency_install:
  stage: verify
  image: python:3.12-bookworm
  timeout: 20m
  needs:
    - job: build_dist
      artifacts: true
  script:
    - python -m pip install dist/*.whl
    - apt-get update
    - cd /tmp
    - chaos-jungle deps install --all --yes
    - chaos-jungle deps check --all

skill_strategy_swarmplus:
  stage: verify
  image: python:3.12-slim
  timeout: 10m
  needs:
    - job: build_dist
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: true
    - when: never
  script:
    - ': "${CJ_EVAL_BASE_URL:?Set CJ_EVAL_BASE_URL in GitLab CI/CD Variables}"'
    - ': "${CJ_EVAL_MODEL:?Set CJ_EVAL_MODEL in GitLab CI/CD Variables}"'
    - ': "${CJ_EVAL_API_KEY:?Set CJ_EVAL_API_KEY in GitLab CI/CD Variables}"'
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - git clone --depth 1 https://github.com/swarm-workflows/SwarmAgents.git ci-strategy-target
    - python ci/generate_skill_strategy.py --repo ci-strategy-target --skills-dir skills --cj-root . --output-dir ci-artifacts/skill-strategy
  artifacts:
    when: always
    paths:
      - ci-artifacts/skill-strategy/
    expire_in: 1 week
