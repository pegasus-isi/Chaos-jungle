stages:
  - test
  - build
  - verify

default:
  tags:
    - docker

unit_tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12"]
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - python -m pytest tests/ -q --strict-markers

real_experiment:
  stage: test
  image: python:3.12-slim
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: manual
      allow_failure: true
  script:
    - python -m pip install -e .
    - python ci/run_real_experiment.py --output-dir ci-artifacts/real-experiment
  artifacts:
    when: always
    paths:
      - ci-artifacts/real-experiment/
    expire_in: 1 week

real_llm_experiment:
  stage: test
  image: python:3.12-slim
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never
  script:
    # GitLab injects project/group CI variables; do not copy their values into YAML.
    - ': "${CJ_EVAL_BASE_URL:?Set CJ_EVAL_BASE_URL in GitLab CI/CD Variables}"'
    - ': "${CJ_EVAL_MODEL:?Set CJ_EVAL_MODEL in GitLab CI/CD Variables}"'
    - ': "${CJ_EVAL_API_KEY:?Set CJ_EVAL_API_KEY in GitLab CI/CD Variables}"'
    - python -m pip install -e .
    - python ci/run_real_experiment.py --mode live --output-dir ci-artifacts/real-llm-experiment
  artifacts:
    when: always
    paths:
      - ci-artifacts/real-llm-experiment/
    expire_in: 1 week

lint:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install "ruff==0.17.4"
    - python ci/check_ruff_baseline.py
    - python -m ruff check ci/run_real_experiment.py

docs_build:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install ".[docs]"
    - python -m sphinx -q -b html docs docs/_build/html
  artifacts:
    paths:
      - docs/_build/html/
    expire_in: 1 week

build_dist:
  stage: build
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python -m twine check dist/*
    - |
      python - <<'PY'
      from pathlib import Path
      from tarfile import open as open_tar
      from zipfile import ZipFile

      wheel, = Path("dist").glob("*.whl")
      sdist, = Path("dist").glob("*.tar.gz")
      resource = "chaos_jungle/scripts/bpf/flow_modify.c"
      with ZipFile(wheel) as archive:
          assert resource in archive.namelist(), f"Missing wheel resource: {resource}"
      with open_tar(sdist) as archive:
          names = archive.getnames()
          assert any(name.endswith("/" + resource) for name in names)
          assert not any("/evaluation/" in name or "/results/" in name for name in names)
      PY
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

verify_dist:
  stage: verify
  image: python:3.12-slim
  needs:
    - job: build_dist
      artifacts: true
  script:
    - python -m pip install dist/*.whl
    - cd /tmp
    - python -c 'from importlib.metadata import version; from importlib.resources import files; import chaos_jungle; assert version("chaos-jungle") == chaos_jungle.__version__; assert (files("chaos_jungle.scripts.bpf") / "flow_modify.c").is_file()'
    - chaos-jungle --help
