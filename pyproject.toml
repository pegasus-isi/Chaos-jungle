[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaos-jungle"
version = "0.1.0a2"
description = "A generic chaos engineering framework for distributed systems"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "chaos-jungle contributors" }
]
keywords = ["chaos", "engineering", "fault injection", "testing", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "paramiko>=3.0,<6.0",
    "click>=8.0,<9.0",
    "requests>=2.28,<3.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=0.9",
    "sphinx-design>=0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff==0.17.4",
    "commitizen>=4.19,<5; python_version >= '3.10'",
    "pre-commit>=4.5,<5; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/pegasus-isi/Chaos-jungle"
Documentation = "https://pegasus-isi.github.io/Chaos-jungle/"
Issues = "https://github.com/pegasus-isi/Chaos-jungle/issues"
Repository = "https://github.com/pegasus-isi/Chaos-jungle"

[project.scripts]
chaos-jungle = "chaos_jungle.control.cli:main"
cj-daemon    = "chaos_jungle.control.daemon:run"

[project.entry-points."pytest11"]
chaos-jungle = "chaos_jungle.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["chaos_jungle"]

[tool.hatch.build.targets.sdist]
only-include = ["chaos_jungle", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "docker: requires a local Docker daemon and a prebuilt local test image",
    "gateway: requires a real OpenAI-compatible LLM gateway and credentials",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = ["chaos_jungle/__init__.py:__version__", "docs/conf.py:release =", "README.md:Current package version"]
