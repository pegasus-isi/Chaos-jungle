name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --strict-markers

      - name: Run lint (ruff)
        run: |
          python ci/check_ruff_baseline.py

  dependency-install:
    name: Install all mapped system dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: python:3.12-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install Chaos Jungle
        run: python -m pip install .

      - name: Install and verify system commands
        run: |
          apt-get update
          chaos-jungle deps install --all --yes
          chaos-jungle deps check --all
