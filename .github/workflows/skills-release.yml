name: Release Chaos Jungle Skills

on:
  push:
    tags: ["skills-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing skills tag, such as skills-v0.1.0a0
        required: true
        type: string

permissions:
  contents: read

env:
  SKILLS_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SKILLS_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify skills tag and source branch
        run: |
          git fetch origin main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "refs/tags/$SKILLS_TAG^{commit}")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["SKILLS_TAG"] == f"skills-v{version}", "Skills tag must match package version"
          notes = Path("docs/releases") / f"{os.environ['SKILLS_TAG']}.md"
          assert notes.is_file(), f"Missing release notes: {notes}"
          PY
      - name: Test skills archive builder
        run: |
          python -m pip install -e . "pytest>=8"
          python -m pytest tests/test_ci_build_skill_bundle.py -q
      - name: Build and verify the skills bundle
        run: |
          python ci/build_skill_bundle.py --version "${SKILLS_TAG#skills-v}" --output-dir dist
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from ci.build_skill_bundle import SKILL_NAMES

          archive_path = Path("dist") / f"chaos-jungle-{os.environ['SKILLS_TAG']}.zip"
          with ZipFile(archive_path) as archive:
              names = set(archive.namelist())
              expected = {
                  f"{skill}/{path.relative_to(Path('skills') / skill).as_posix()}"
                  for skill in SKILL_NAMES
                  for path in (Path("skills") / skill).rglob("*")
                  if path.is_file()
              }
              assert names == expected
              assert all(f"{skill}/SKILL.md" in names for skill in SKILL_NAMES)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skills-bundle
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SKILLS_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: skills-bundle
          path: dist
      - name: Publish GitHub skills release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$SKILLS_TAG" dist/*.zip \
            --verify-tag --prerelease --latest=false \
            --title "Chaos Jungle skills ${SKILLS_TAG#skills-v}" \
            --notes-file "docs/releases/$SKILLS_TAG.md"
